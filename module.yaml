# The manifest of the connect-timelapse module. `prusa-connect module add`
# reads it out of the release and writes one resource declaration from it.
#
# The namespace is absent on purpose: the host derives it from the module path
# the operator installs from (github.com/philip-soerensen/connect-local-timelapse
# becomes com.github.aux.philip-soerensen.connect-local-timelapse).

name: connect-timelapse
title: Timelapse
summary: 'Records a timelapse video of every print: while a printer prints, one frame per interval is saved from the camera snapshots the Connect server records (the server pulls RTSP/HTTP streams itself; this module makes no outbound connections), and at the end the frames become one MP4 via ffmpeg on the server. The "Timelapse" tab on each printer page configures the camera and shows the recordings; a guide page is in the Extensions menu. Keeps the last keep_prints prints.'
kind: sink
version: 0.3.1
license: MIT
# The plugin wire major the process half speaks.
contract_major: 1
# The fragment describing the module's routes, relative to its mount.
openapi: openapi.json

# The permissions this module may take as itself. This is the ceiling: the
# operator approves it at `module add -approve`, which grants the viewer role
# for `observe` (and read_storage). `observe` reads devices and subscribes to
# the event stream; `read_storage` reads the stored camera snapshots.
permissions:
  - observe
  - read_storage

# The action the module only asks access.check about (from its routes, to
# authorize a caller's write), without being allowed to take it itself:
# `operate` on a printer, for the Timelapse tab's source picker and for
# deleting that printer's timelapses.
checks:
  - operate

# The endpoints this instance may publish on. `ready` publishes event type
# <namespace>/timelapse.ready when one print's video has been assembled.
events:
  ready: timelapse.ready

# A writable directory for the saved frames and assembled videos (granted at
# install), and a memory budget: ffmpeg runs as a child process when a video
# is assembled, and its memory counts toward the budget. x264 at camera
# resolutions (1080p and up) with default threading easily exceeds 256 MiB,
# which got the instance killed as over-memory mid-assembly; 1024 MiB plus
# the -threads 2 cap in ffmpegAssemble leaves ample headroom.
needs:
  data: true
  memory_mib: 1024

# The settings, with defaults. The host sends the result on plugin.configure
# before any other call; the operator overrides keys in the instance's
# `config:` block.
options:
  - key: enabled
    type: bool
    default: "true"
    summary: Master switch. When false, no frames are saved and no videos are assembled.
  - key: video_crf
    type: int
    default: "23"
    summary: x264 constant quality (0 lossless .. 51 worst). 23 is the x264 default; lower is bigger and better.
  - key: keep_prints
    type: int
    default: "5"
    summary: How many finished prints are kept, frames and video included. Older records are deleted when a new one is assembled.
  - key: max_frame_bytes
    type: int
    default: "8388608"
    summary: Largest camera frame, in bytes, the module will read (the host caps pushed frames at 8 MiB).
# The browser half: a tab titled "Timelapse" on every printer's page. The
# built bundle lives under ui/ in the release.
ui:
  entry: ui/index.js
  library: ">=0.0.1 <1.0.0"
  contributes:
    pages:
      - path: guide
        title: Timelapse guide
        icon: layers
    device_tab:
      - id: timelapse
        title: Timelapse

platforms:
  - linux_amd64
  - linux_arm64
  - darwin_amd64
  - darwin_arm64
  - windows_amd64
